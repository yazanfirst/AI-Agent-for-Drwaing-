name: SIA Table 2 Thread Sensitivity

on:
  push:
    branches:
      - sindex-oracle-experiment
    paths:
      - experiments/table2-thread-sensitivity/**
      - .github/workflows/sia-table2-thread-sensitivity.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  thread-sensitivity:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git wget gnupg python3
          wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo apt-get install -y intel-oneapi-mkl-devel

      - name: Clone and fix SIA
        run: |
          git clone --depth 1 https://github.com/casys-kaist/sia.git sia
          python3 experiments/sia-artifact-audit/apply_artifact_fixes.py sia
          sudo mkdir -p /opt/intel/mkl/lib
          sudo ln -sfn /opt/intel/oneapi/mkl/latest/include /opt/intel/mkl/include
          sudo ln -sfn /opt/intel/oneapi/mkl/latest/lib /opt/intel/mkl/lib/intel64

      - name: Build
        working-directory: sia
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target micro_ideal_UNIFORM_DIST -j2

      - name: Run thread sensitivity
        working-directory: sia
        run: bash "$GITHUB_WORKSPACE/experiments/table2-thread-sensitivity/run.sh"

      - name: Summarize
        if: always()
        run: |
          echo "### SIA Table 2 Thread Sensitivity" >> "$GITHUB_STEP_SUMMARY"
          if [ -d sia/thread_sensitivity_results ]; then
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            python3 experiments/table2-thread-sensitivity/compare_thread_sensitivity.py sia/thread_sensitivity_results \
              | tee -a "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sia-table2-thread-sensitivity
          path: sia/thread_sensitivity_results/
          if-no-files-found: warn
