name: SIA Artifact Reproducibility Audit

on:
  push:
    branches:
      - sindex-oracle-experiment
    paths:
      - experiments/sia-artifact-audit/**
      - .github/workflows/sia-artifact-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git wget gnupg python3
          wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo apt-get install -y intel-oneapi-mkl-devel

      - name: Clone pristine SIA
        run: |
          git clone --depth 1 https://github.com/casys-kaist/sia.git sia-pristine
          cp -a sia-pristine sia-fixed

      - name: Audit pristine artifact
        run: |
          python3 experiments/sia-artifact-audit/audit_sia_artifact.py sia-pristine \
            | tee pristine_audit.txt

      - name: Apply guarded fixes
        run: python3 experiments/sia-artifact-audit/apply_artifact_fixes.py sia-fixed

      - name: Audit fixed artifact
        run: |
          python3 experiments/sia-artifact-audit/audit_sia_artifact.py sia-fixed --expect-fixed \
            | tee fixed_audit.txt

      - name: Make oneMKL 2026 visible at legacy SIA paths
        run: |
          sudo mkdir -p /opt/intel/mkl/lib
          sudo ln -sfn /opt/intel/oneapi/mkl/latest/include /opt/intel/mkl/include
          sudo ln -sfn /opt/intel/oneapi/mkl/latest/lib /opt/intel/mkl/lib/intel64

      - name: Configure fixed CMake artifact
        working-directory: sia-fixed
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Prove restored target exists and builds
        working-directory: sia-fixed
        run: cmake --build build --target micro_ideal_UNIFORM_DIST -j2

      - name: Smoke test fixed ideal-training-time CLI
        working-directory: sia-fixed
        env:
          MKL_THREADING_LAYER: SEQUENTIAL
          LD_LIBRARY_PATH: /opt/intel/oneapi/mkl/latest/lib/intel64
        run: |
          ./build/micro_ideal_UNIFORM_DIST \
            --fg=1 --bg=0 --runtime=1 \
            --read=1 --insert=0 --update=0 --remove=0 --scan=0 \
            --initial-size=1000 --target-size=1000 --table-size=1000 \
            --ideal-training-time=5 \
            | tee ../fixed_cli_smoke.txt

      - name: Write audit summary
        if: always()
        run: |
          {
            echo "### SIA Artifact Reproducibility Audit"
            echo
            echo "**Pristine:**"
            echo '```text'
            cat pristine_audit.txt 2>/dev/null || true
            echo '```'
            echo
            echo "**After guarded fixes:**"
            echo '```text'
            cat fixed_audit.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sia-artifact-audit-evidence
          path: |
            pristine_audit.txt
            fixed_audit.txt
            fixed_cli_smoke.txt
          if-no-files-found: warn
