name: SIndex Throttle Experiment

on:
  push:
    branches:
      - sindex-oracle-experiment
    paths:
      - experiments/sindex-throttle/**
      - .github/workflows/sindex-throttle.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  throttle-experiment:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git wget gnupg python3
          wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo apt-get install -y intel-oneapi-mkl-devel

      - name: Clone SIA
        run: git clone --depth 1 https://github.com/casys-kaist/sia.git sia

      - name: Apply measurement patch
        run: python3 experiments/sindex-oracle/apply_oracle_patch.py sia

      - name: Apply throttle patch
        run: python3 experiments/sindex-throttle/apply_throttle_patch.py sia

      - name: Run throttle experiment
        working-directory: sia
        run: bash "$GITHUB_WORKSPACE/experiments/sindex-throttle/run_throttle_experiment.sh"

      - name: Summarize
        if: always()
        run: |
          echo "### SIndex Throttle Experiment" >> "$GITHUB_STEP_SUMMARY"
          if [ -f sia/throttle_results/duty_1_00.txt ]; then
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            python3 experiments/sindex-throttle/compare_throttle.py sia/throttle_results \
              | tee -a "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Experiment did not reach results." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sindex-throttle-results
          path: sia/throttle_results/
          if-no-files-found: warn
