name: SIndex Multi-Index Maintenance

on:
  push:
    branches:
      - sindex-oracle-experiment
    paths:
      - experiments/sindex-multi-maintenance/**
      - .github/workflows/sindex-multi-maintenance.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  multi-index-maintenance:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git wget gnupg python3
          wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo apt-get install -y intel-oneapi-mkl-devel

      - name: Clone SIA
        run: git clone --depth 1 https://github.com/casys-kaist/sia.git sia

      - name: Apply measurement patch
        run: python3 experiments/sindex-oracle/apply_oracle_patch.py sia

      - name: Apply multi-index coordination patch
        run: python3 experiments/sindex-multi-maintenance/apply_multi_patch.py sia

      - name: Run cross-index experiment
        working-directory: sia
        run: bash "$GITHUB_WORKSPACE/experiments/sindex-multi-maintenance/run_multi_experiment.sh"

      - name: Summarize
        if: always()
        run: |
          echo "### Cross-Index Maintenance Coordination" >> "$GITHUB_STEP_SUMMARY"
          if [ -d sia/multi_results ]; then
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            python3 experiments/sindex-multi-maintenance/compare_multi.py sia/multi_results \
              | tee -a "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sindex-multi-maintenance-results
          path: sia/multi_results/
          if-no-files-found: warn
